name: CI Quality & Data Tests

on:
  push:
    branches: [ master, main, "feat/**" ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Formatter check
        run: |
          ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Pipeline Reconciliation Test
        run: |
          python scripts/reconcile_pipeline.py --produced 500 --dlq 2 --processed 498

      - name: Run Real Metrics Measurement
        run: |
          python scripts/measure_metrics.py

      - name: Run dbt CI build on fixtures (isolated, zero-cloud)
        run: |
          cd dbt_project
          dbt deps
          dbt seed --target ci --profiles-dir .
          dbt build --target ci --select tag:ci --profiles-dir .

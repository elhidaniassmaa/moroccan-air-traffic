[project]
name = "moroccan-air-traffic"
version = "1.0.0"
description = "Real-time streaming platform for Moroccan air traffic analysis"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ingestion", "streaming", "orchestration", "dashboard", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "T20",  # print statements
    "RET",  # return
    "ICN",  # import conventions
    "LOG",  # logging
]
ignore = [
    "T201",   # allow print in scripts
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "streaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (Kafka, API)",
    "slow: marks slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

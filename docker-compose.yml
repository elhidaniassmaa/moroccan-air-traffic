# ─────────────────────────────────────────────────────────────
# Moroccan Air Traffic Streaming Platform — Docker Compose
# Usage: docker compose up -d --build
# ─────────────────────────────────────────────────────────────
name: moroccan-air-traffic

services:
  # ── Redpanda (Kafka-compatible streaming) ──────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"   # Kafka external
      - "18082:18082"   # Pandaproxy
      - "18081:18081"   # Schema Registry
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'HEALTHY'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redpanda Console (Kafka UI) ────────────────────────────
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./infra/redpanda-console-config.yml:/tmp/config.yml:ro
    ports:
      - "8080:8080"

  # ── Topic initializer ──────────────────────────────────────
  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c "
      echo 'Creating topics...'
      rpk topic create flights.raw \
        --brokers redpanda:9092 \
        --partitions 3 \
        --config cleanup.policy=delete \
        --config retention.ms=604800000 || true
      rpk topic create flights.dlq \
        --brokers redpanda:9092 \
        --partitions 1 \
        --config cleanup.policy=compact || true
      echo 'Topics created.'
      rpk topic list --brokers redpanda:9092
      "
    restart: "no"

  # ── OpenSky Producer ───────────────────────────────────────
  opensky-producer:
    build:
      context: .
      dockerfile: infra/Dockerfile.producer
    container_name: opensky-producer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    restart: unless-stopped

volumes:
  redpanda_data:

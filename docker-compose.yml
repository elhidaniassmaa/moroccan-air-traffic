name: moroccan-air-traffic

# ─────────────────────────────────────────────────────────────────────────────
# Ancre YAML partagée par les trois services Airflow (webserver, scheduler, init)
# Les deux clés secrètes sont OBLIGATOIRES : elles doivent être définies dans .env
# ─────────────────────────────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/Dockerfile.airflow
  image: moroccan-air-traffic-airflow:2.8.4
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?Set AIRFLOW__CORE__FERNET_KEY in .env}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW__WEBSERVER__SECRET_KEY:?Set AIRFLOW__WEBSERVER__SECRET_KEY in .env}"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - ./data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE STREAMING : Apache Kafka (Confluent) + Kafka UI
  # ─────────────────────────────────────────────────────────────────────────

  # Zookeeper : coordinateur de cluster Kafka (requis par Confluent Platform 7.x)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: moroccan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Apache Kafka broker (Confluent Platform 7.6.1 = Kafka 3.6)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: moroccan-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"   # listener interne (entre containers)
      - "19092:19092" # listener externe (hôte Windows -> kafka)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Deux listeners : un pour le réseau Docker, un pour l'hôte Windows
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Kafka UI — http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: moroccan-air-traffic
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    restart: unless-stopped

  # Crée les topics flights.raw et flights.dlq au démarrage
  init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic flights.raw \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic flights.dlq \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=compact
        echo "=== Topics created ==="
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE INGESTION : producteur OpenSky / Synthétique
  # ─────────────────────────────────────────────────────────────────────────

  opensky-producer:
    build:
      context: .
      dockerfile: infra/Dockerfile.producer
    container_name: opensky-producer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE STREAMING SPARK : Bronze puis Silver (Delta Lake)
  # ─────────────────────────────────────────────────────────────────────────

  # Spark Bronze : consomme flights.raw, déduplique (watermark 10 min), écrit Delta
  spark-bronze:
    build:
      context: .
      dockerfile: infra/Dockerfile.spark
    container_name: spark-bronze
    depends_on:
      opensky-producer:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_FLIGHTS: flights.raw
      DELTA_BRONZE_PATH: /app/data/lake/bronze/flights
      BRONZE_CHECKPOINT_PATH: /app/data/checkpoints/bronze_flights
    volumes:
      - ./data:/app/data
      - ./streaming:/app/streaming
    command: ["streaming/flights_bronze_stream.py"]
    restart: unless-stopped

  # Spark Silver : lit Bronze Delta, enrichit (haversine + phase), écrit Silver Delta
  spark-silver:
    build:
      context: .
      dockerfile: infra/Dockerfile.spark
    container_name: spark-silver
    depends_on:
      spark-bronze:
        condition: service_started
    environment:
      DELTA_BRONZE_PATH: /app/data/lake/bronze/flights
      DELTA_SILVER_PATH: /app/data/lake/silver/flights
      SILVER_CHECKPOINT_PATH: /app/data/checkpoints/silver_flights
    volumes:
      - ./data:/app/data
      - ./streaming:/app/streaming
    command: ["streaming/flights_silver_stream.py"]
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE STOCKAGE : PostgreSQL (métadonnées Airflow) + Warehouse (analytique)
  # ─────────────────────────────────────────────────────────────────────────

  # PostgreSQL pour Airflow uniquement (métadonnées, état des DAGs)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # PostgreSQL data warehouse (dbt Gold, séparé d'Airflow)
  # Depuis Windows : localhost:5433
  warehouse:
    image: postgres:15-alpine
    container_name: warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-flights_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-flights_password_dev}
      POSTGRES_DB: ${WAREHOUSE_DB:-flights_dw}
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-flights_user} -d ${WAREHOUSE_DB:-flights_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE ORCHESTRATION : Apache Airflow 2.8.4 (LocalExecutor)
  # ─────────────────────────────────────────────────────────────────────────

  # Initialise la base Airflow et crée l'utilisateur admin (s'exécute une fois)
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@moroccan-traffic.ma || true
    restart: "no"

  # Interface web Airflow : http://localhost:8085 (admin / admin)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8085:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # Scheduler Airflow (déclenche weather_daily, dbt_hourly, silver_to_pg)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # COUCHE VISUALISATION : Dashboard Streamlit
  # ─────────────────────────────────────────────────────────────────────────

  dashboard:
    image: python:3.11-slim
    container_name: dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-flights_dw}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-flights_user}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-flights_password_dev}
    command: >
      bash -c "pip install --no-cache-dir streamlit pydeck plotly pandas numpy sqlalchemy psycopg2-binary &&
               streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  warehouse_data: